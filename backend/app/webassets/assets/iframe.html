<!DOCTYPE html>
<!-- lang is English until the widget sets the language of the locale it is shown in -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="modulepreload" href="remark.mjs" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- every embed loads this same document, so crawlers must not index it as a page of its own;
         indexifembedded keeps the comments indexed as part of the page that embeds them -->
    <meta name="robots" content="noindex, indexifembedded" />
    <title>Comments</title>
    <base target="_blank" />
    <script>
      if (window.location.search === '?selfClose') {
        window.close();
      }
      (function () {
        // the parent sets color-scheme on the iframe element from the theme param. this document
        // must match it before the first paint, otherwise the canvas is painted opaque in its own
        // scheme instead of staying transparent, which flashes white on dark host pages.
        try {
          var pairs = window.location.search.substring(1).split('&');
          var theme = '';

          for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split('=');
            if (pair[0] === 'theme') {
              theme = decodeURIComponent(pair[1] || '');
              break;
            }
          }

          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
          // remark.css keys the colors of the light theme on this class, the preloader's included
          document.documentElement.classList.toggle('light', theme !== 'dark');
        } catch (e) {}
      })();
      (function () {
        function isCSSVariablesSupported() {
          if (typeof window === `undefined`) {
            return true;
          }

          return window.CSS && window.CSS.supports && window.CSS.supports('color', 'var(--fake-var)');
        }
        if (isCSSVariablesSupported()) {
          try {
            var name = JSON.parse(window.name);
            var colors = name.__colors__;
            var root = document.documentElement;
            if (colors) {
              for (var color in colors) {
                if (!color.startsWith('--')) {
                  console.info('Key ' + color + ' must start with `--`');
                  continue;
                }
                root.style.setProperty(color, colors[color]);
              }
            }
          } catch (e) {}
        }
      })();
    </script>
    <link rel="stylesheet" href="remark.css" />
  </head>
  <body>
    <div id="remark42">
      <div class="preloader preloader_view_iframe"></div>
    </div>
    <script>
      window.addEventListener('message', function receiveMessages(event) {
        try {
          // only the page embedding this document. any window holding a reference can post here,
          // and this handler navigates through location.replace and sets the document title
          if (event.source !== window.parent) return;

          const data = event.data;
          const isObj = typeof data === 'object' && data !== null && !Array.isArray(data);
          if (!isObj) return;
          const isItHash = data.hash && data.hash.indexOf('#') === 0;

          if (isItHash) {
            location.replace(data.hash);
          }

          // the title of the page the comments are on, which a new comment carries. kept apart
          // from document.title, whose placeholder above names no page: a document opened on its
          // own never receives a title, and then the backend reads it from the page instead
          if (data.title) {
            document.title = data.title;
            remark_config.host_page_title = data.title;
          }

          // the bundle has not registered its own listener yet: it is only inserted below, after
          // `inited`, which is when the parent posts the current theme. Keep the latest one where
          // remark.tsx reads it on start, and match color-scheme to the iframe element meanwhile
          if (data.theme === 'light' || data.theme === 'dark') {
            remark_config.theme = data.theme;
            document.documentElement.style.colorScheme = data.theme;
            document.documentElement.classList.toggle('light', data.theme === 'light');
          }
        } catch (e) {}
      });

      var remark_config =
        window.location.search.length < 2
          ? {}
          : window.location.search
              .substring(1)
              .split('&')
              .reduce(function (c, x) {
                var splitted = x.split('=');
                if (!splitted[1]) {
                  splitted[1] = '';
                }
                c[splitted[0]] = decodeURIComponent(splitted[1]);
                return c;
              }, {});

      window.parent.postMessage({ inited: true }, '*');
    </script>
    <script>
      (function (d) {
        var r = d.head || d.body;
        var s = d.createElement('script');
        s.src = 'remark.mjs';
        s.type = 'module';
        s.async = true;
        s.defer = true;
        r.appendChild(s);
      })(document);
    </script>
  </body>
</html>
