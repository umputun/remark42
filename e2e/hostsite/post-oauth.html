<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A page on somebody else's site, with OAuth comments</title>
  </head>
  <body>
    <h1>A page on somebody else's site, with OAuth comments</h1>
    <p>
      Served from a different origin than the comments it embeds, and over https, which is the only
      way the widget's cookies can carry Secure, SameSite=None and Partitioned.
    </p>
    <div id="remark42"></div>
    <script>
      var remark_config = {
        host: 'https://remark42-oauth:8445',
        site_id: 'remark',
        components: ['embed'],
        url: window.location.href,
      };
    </script>
    <script src="embed.js"></script>
  </body>
</html>
