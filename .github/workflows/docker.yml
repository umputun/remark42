name: docker

on:
  workflow_run:
    workflows: [backend, frontend]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  build:
    name: Build Docker image (${{ matrix.platform }})
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      (github.event.workflow_run.head_branch == 'master' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: sign in to Azure with federated credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          docker system prune -af

      - name: build and push to Azure Container Registry by digest
        id: build-acr
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          build-args: |
            SKIP_BACKEND_TEST=true
            SKIP_FRONTEND_TEST=true
            CI=github
            GITHUB_SHA=${{ github.event.workflow_run.head_sha }}
            GIT_BRANCH=${{ github.event.workflow_run.head_branch }}
            GITHUB_REF=refs/heads/${{ github.event.workflow_run.head_branch }}
          outputs: type=image,name=${{ env.ACR_LOGIN_SERVER }}/remark42,push-by-digest=true,name-canonical=true,push=true

      - name: export digests
        run: |
          mkdir -p /tmp/digests/acr
          digest="${{ steps.build-acr.outputs.digest }}"
          touch "/tmp/digests/acr/${digest#sha256:}"

      - name: upload ACR digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-acr-${{ matrix.artifact }}
          path: /tmp/digests/acr/*
          retention-days: 1

  merge:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: download ACR digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests/acr
          pattern: digests-acr-*
          merge-multiple: true

      - name: verify all digests present
        run: |
          expected=2
          actual=$(find /tmp/digests/acr -maxdepth 1 -type f | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "Expected $expected ACR digests, found $actual"
            ls -la /tmp/digests/acr
            exit 1
          fi
          echo "All ACR digests present"

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: sign in to Azure with federated credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: create ACR manifest and push
        working-directory: /tmp/digests/acr
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$HEAD_BRANCH" == v* ]]; then
            docker buildx imagetools create \
              -t ${ACR_LOGIN_SERVER}/remark42:${HEAD_BRANCH} \
              -t ${ACR_LOGIN_SERVER}/remark42:latest \
              $(printf "${ACR_LOGIN_SERVER}/remark42@sha256:%s " *)
          else
            docker buildx imagetools create \
              -t ${ACR_LOGIN_SERVER}/remark42:${HEAD_BRANCH} \
              $(printf "${ACR_LOGIN_SERVER}/remark42@sha256:%s " *)
          fi

