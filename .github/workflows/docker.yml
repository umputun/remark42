name: docker

on:
  workflow_run:
    workflows: [backend, frontend]
    types: [completed]

# the event is part of the key: a pull request from a fork whose branch is called master would
# otherwise share the group of master pushes and cancel an image build in flight
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  # a push touching both backend and frontend completes two workflows, and each completion starts
  # this one. Build only once the other workflow has finished green for the same commit, or never
  # ran for it: when it is still running, its own completion starts the build again
  #
  # images are published for master and for release tags only. head_branch is the tag name for a tag
  # push and the branch name for a branch push, and the event has no field telling the two apart, so
  # a release is recognised by its vX.Y.Z name. The job condition cannot match a pattern and only
  # drops what is certainly not published; the step decides, and its release output is what gives
  # an image the latest tag
  gate:
    name: Check the other workflow
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      (github.event.workflow_run.head_branch == 'master' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      build: ${{ steps.sibling.outputs.build }}
      release: ${{ steps.sibling.outputs.release }}
    steps:
      - name: read the other workflow's run for this commit
        id: sibling
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          release=false
          if [[ "$HEAD_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [[ "$HEAD_BRANCH" != master && "$release" != true ]]; then
            echo "$HEAD_BRANCH is neither master nor a release tag, no image"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TRIGGER" in
            backend) sibling=ci-frontend.yml ;;
            frontend) sibling=ci-backend.yml ;;
            *) echo "unexpected triggering workflow: $TRIGGER" >&2; exit 1 ;;
          esac
          runs=$(gh api -X GET "repos/$REPO/actions/workflows/$sibling/runs" \
            -f head_sha="$HEAD_SHA" -f branch="$HEAD_BRANCH" -f event="$EVENT" -f per_page=1)
          state=$(jq -r '.workflow_runs[0] // {} | "\(.status // "none") \(.conclusion // "")"' <<< "$runs")
          echo "$sibling for $HEAD_SHA on $HEAD_BRANCH: $state"
          case "$state" in
            "none "* | "completed success") echo "build=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "build=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build Docker image (${{ matrix.platform }})
    needs: gate
    if: needs.gate.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PKG_TOKEN }}

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          docker system prune -af

      - name: build and push to ghcr.io by digest
        id: build-ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          build-args: |
            SKIP_BACKEND_TEST=true
            SKIP_FRONTEND_TEST=true
            CI=github
            GITHUB_SHA=${{ github.event.workflow_run.head_sha }}
            GIT_BRANCH=${{ github.event.workflow_run.head_branch }}
            GITHUB_REF=refs/heads/${{ github.event.workflow_run.head_branch }}
          outputs: type=image,name=ghcr.io/umputun/remark42,push-by-digest=true,name-canonical=true,push=true

      - name: export digest
        env:
          DIGEST: ${{ steps.build-ghcr.outputs.digest }}
        run: |
          mkdir -p /tmp/digests/ghcr
          touch "/tmp/digests/ghcr/${DIGEST#sha256:}"

      - name: upload ghcr digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-ghcr-${{ matrix.artifact }}
          path: /tmp/digests/ghcr/*
          retention-days: 1


  merge:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: [gate, build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: download ghcr digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests/ghcr
          pattern: digests-ghcr-*
          merge-multiple: true

      - name: verify all digests present
        run: |
          expected=2
          actual=$(find /tmp/digests/ghcr -maxdepth 1 -type f | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "Expected $expected digests, found $actual"
            ls -la /tmp/digests/ghcr
            exit 1
          fi
          echo "All digests present"

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PKG_TOKEN }}

      - name: login to DockerHub
        uses: docker/login-action@v4
        with:
          username: umputun
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: create ghcr.io manifest and push
        working-directory: /tmp/digests/ghcr
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE: ${{ needs.gate.outputs.release }}
        run: |
          # anything but true or false means the gate's output did not arrive; reading that as
          # false would publish a release without latest and stay green
          case "$RELEASE" in
            true) latest=(-t ghcr.io/umputun/remark42:latest) ;;
            false) latest=() ;;
            *) echo "unexpected release flag: '$RELEASE'" >&2; exit 1 ;;
          esac
          docker buildx imagetools create \
            -t ghcr.io/umputun/remark42:${HEAD_BRANCH} "${latest[@]}" \
            $(printf 'ghcr.io/umputun/remark42@sha256:%s ' *)

      # the per-platform images were pushed to ghcr only; imagetools copies them to DockerHub
      - name: create DockerHub manifest and push
        working-directory: /tmp/digests/ghcr
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE: ${{ needs.gate.outputs.release }}
        run: |
          case "$RELEASE" in
            true) latest=(-t umputun/remark42:latest) ;;
            false) latest=() ;;
            *) echo "unexpected release flag: '$RELEASE'" >&2; exit 1 ;;
          esac
          docker buildx imagetools create \
            -t umputun/remark42:${HEAD_BRANCH} "${latest[@]}" \
            $(printf 'ghcr.io/umputun/remark42@sha256:%s ' *)

  deploy:
    name: Deploy to remark42.com
    runs-on: ubuntu-latest
    needs: merge
    if: github.event.workflow_run.head_branch == 'master'
    permissions: {} # only calls an external URL via curl, no GitHub API access needed

    steps:
      - name: trigger deployment
        env:
          UPDATER_KEY: ${{ secrets.UPDATER_KEY }}
        run: curl -sf https://jess.umputun.com/update/remark42-core/${UPDATER_KEY}
