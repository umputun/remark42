name: frontend

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ci-frontend.yml"
      - ".github/actions/setup-go/**"
      - "frontend/**"
      # the message catalogs, which the translation check and the tests read
      - "backend/app/webassets/assets/*.json"
      - "!**.md"
  pull_request:
    paths:
      - ".github/workflows/ci-frontend.yml"
      - ".github/actions/setup-go/**"
      - "frontend/**"
      # the message catalogs, which the translation check and the tests read
      - "backend/app/webassets/assets/*.json"
      - "!**.md"

jobs:
  translations-check:
    name: Translations check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # no pnpm install, as in the unit job: extraction and the check are node scripts with no
      # dependencies, and the missing install is what keeps them that way. these are the
      # translation:extract and translation:check scripts of package.json, repeated here
      - name: Translations check
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON ./tasks/extract-messages.ts
          node ./tasks/checkTranslation.js
        working-directory: ./frontend/apps/remark42

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.10.0
          run_install: false

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
          cache-dependency-path: frontend/apps/remark42/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend/apps/remark42

      - name: Run type check
        run: pnpm type-check
        working-directory: ./frontend/apps/remark42

  lint:
    name: Eslint & Stylelint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.10.0
          run_install: false

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
          cache-dependency-path: frontend/apps/remark42/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend/apps/remark42

      - name: Run linters
        run: pnpm lint
        working-directory: ./frontend/apps/remark42

  size-limit:
    name: Size limit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.10.0
          run_install: false

      # no matrix here, so the check keeps the name "Size limit"
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/apps/remark42/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend/apps/remark42

      # the widget is compiled by the go program in frontend/build, which `pnpm build` runs
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-mod: frontend/build/go.mod
          cache-dependency-path: frontend/build/go.sum

      # the budgets live in tasks/check-size.ts; the check prints each file's gzipped size against
      # its budget and fails when one is over or missing
      - name: Check bundle size
        run: pnpm size-check
        working-directory: ./frontend/apps/remark42

  builder:
    name: Builder tests & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-mod: frontend/build/go.mod
          cache-dependency-path: frontend/build/go.sum

      # the tests build a fixture app of their own, so nothing has to be installed for them
      - name: Test
        run: go test -race -count 1 ./...
        working-directory: ./frontend/build

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: frontend/build
          args: --config ../../backend/.golangci.yml

  unit:
    name: Dependency-free unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # deliberately no pnpm install: these tests import nothing but the module under test and
      # node:test, and the runtime strips the types itself. a run that needs node_modules to pass
      # has picked up a dependency, and the missing install step is what says so.
      #
      # the file count is checked first because node --test exits 0 on a glob that matches
      # nothing, so on its own it cannot tell a renamed suffix from a passing run
      - name: Run unit tests
        run: |
          count=$(find app tasks -name '*.unit.test.ts' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no *.unit.test.ts files matched; the suffix or the layout has moved"
            exit 1
          fi
          mkdir -p coverage
          node --test --experimental-test-coverage \
            --test-reporter=lcov --test-reporter-destination=./coverage/lcov.info \
            --test-reporter=spec --test-reporter-destination=stdout \
            "app/**/*.unit.test.ts" "tasks/**/*.unit.test.ts"
        working-directory: ./frontend/apps/remark42

      # the modules this layer covers are reached by jest only indirectly, and some not at all,
      # so without this upload moving code into them reads as a coverage regression
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ./frontend/apps/remark42
          # the path is resolved from working-directory above, so it must be relative to it:
          # repeating the prefix doubles it, the file is never found, and the upload survives only
          # on codecov's own search
          files: ./coverage/lcov.info
          flags: unit

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.10.0
          run_install: false

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
          cache-dependency-path: frontend/apps/remark42/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend/apps/remark42

      - name: Test & Coverage
        run: pnpm coverage
        working-directory: ./frontend/apps/remark42

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ./frontend/apps/remark42
